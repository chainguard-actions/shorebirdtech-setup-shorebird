name: Test Shorebird installation with cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install Shorebird (latest, with cache)
        uses: .
        with:
          cache: "true"

      - name: Assert shorebird is on PATH
        run: |
          echo "Checking shorebird is available on PATH..."
          if ! command -v shorebird >/dev/null 2>&1; then
            echo "FAIL: shorebird not found on PATH"
            exit 1
          fi
          echo "PASS: shorebird found at $(command -v shorebird)"

      - name: Assert shorebird --version runs
        run: |
          echo "Running shorebird --version..."
          output=$(shorebird --version 2>&1 || true)
          echo "output: $output"
          if [ -z "$output" ]; then
            echo "FAIL: shorebird --version produced no output"
            exit 1
          fi
          echo "PASS: shorebird --version produced output"

      - name: Assert install path exists
        run: |
          install_path="${HOME}/.shorebird"
          echo "Checking install path: $install_path"
          if [ ! -d "$install_path" ]; then
            echo "FAIL: install path $install_path does not exist"
            exit 1
          fi
          echo "PASS: install path exists"

      - name: Assert shorebird bin directory exists
        run: |
          bin_path="${HOME}/.shorebird/bin"
          echo "Checking bin path: $bin_path"
          if [ ! -d "$bin_path" ]; then
            echo "FAIL: bin path $bin_path does not exist"
            exit 1
          fi
          echo "PASS: bin path exists"
