name: Test basic Shorebird install (no cache, latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Shorebird (latest, no cache)
        id: setup
        uses: .
        with:
          cache: "false"

      - name: Assert shorebird is on PATH
        run: |
          echo "Checking shorebird on PATH..."
          if ! command -v shorebird >/dev/null 2>&1; then
            echo "FAIL: shorebird not found on PATH"
            exit 1
          fi
          echo "PASS: shorebird found at $(command -v shorebird)"

      - name: Assert shorebird --version runs
        run: |
          echo "Running shorebird --version..."
          shorebird --version
          if [ $? -ne 0 ]; then
            echo "FAIL: shorebird --version exited non-zero"
            exit 1
          fi
          echo "PASS: shorebird --version succeeded"
