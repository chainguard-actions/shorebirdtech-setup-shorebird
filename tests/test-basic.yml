name: Test basic Shorebird installation (no cache, latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Install Shorebird (latest, no cache)
        uses: .
        with:
          cache: "false"

      - name: Assert shorebird is on PATH
        run: |
          echo "Checking shorebird is available on PATH..."
          if ! command -v shorebird >/dev/null 2>&1; then
            echo "FAIL: shorebird not found on PATH"
            exit 1
          fi
          echo "PASS: shorebird found at $(command -v shorebird)"

      - name: Assert shorebird --version runs
        run: |
          echo "Running shorebird --version..."
          output=$(shorebird --version 2>&1 || true)
          echo "output: $output"
          # shorebird --version should produce some output
          if [ -z "$output" ]; then
            echo "FAIL: shorebird --version produced no output"
            exit 1
          fi
          echo "PASS: shorebird --version produced output"
