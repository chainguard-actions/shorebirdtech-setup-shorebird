name: Test Shorebird install path determination (Linux)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Shorebird (latest, no cache)
        id: setup
        uses: .
        with:
          cache: "false"

      - name: Assert install path is under HOME
        run: |
          expected_path="${HOME}/.shorebird"
          echo "Checking that shorebird is installed at: $expected_path"
          if [ ! -d "$expected_path" ]; then
            echo "FAIL: expected install directory not found at $expected_path"
            exit 1
          fi
          echo "PASS: install directory exists at $expected_path"

      - name: Assert shorebird bin directory exists
        run: |
          bin_path="${HOME}/.shorebird/bin"
          echo "Checking shorebird bin directory: $bin_path"
          if [ ! -d "$bin_path" ]; then
            echo "FAIL: shorebird bin directory not found at $bin_path"
            exit 1
          fi
          echo "PASS: shorebird bin directory exists at $bin_path"

      - name: Assert shorebird binary exists in bin
        run: |
          shorebird_bin="${HOME}/.shorebird/bin/shorebird"
          echo "Checking shorebird binary: $shorebird_bin"
          if [ ! -f "$shorebird_bin" ]; then
            echo "FAIL: shorebird binary not found at $shorebird_bin"
            exit 1
          fi
          echo "PASS: shorebird binary found at $shorebird_bin"
