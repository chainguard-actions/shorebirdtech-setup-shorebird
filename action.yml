name: Setup Shorebird
description: Install the Shorebird CLI
branding:
  icon: check-circle
  color: yellow
inputs:
  cache:
    description: "Cache the Shorebird installation and artifacts. Default: false"
    required: false
    default: "false"
  shorebird-version:
    description: >-
      Not recommended. Pins the Shorebird CLI release to install (the version `shorebird --version` prints, e.g. 1.6.125; not a Flutter version). Defaults to the latest stable release. Shorebird's servers stop accepting old CLI versions over time, so a pinned version will eventually break. To build with a specific Flutter version, pass --flutter-version to `shorebird release` instead.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Determine Install Path (MacOS / Linux)
      if: ${{ runner.os != 'Windows' }}
      id: install-path
      run: |
        install_path=$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.shorebird" || printf %s "${XDG_CONFIG_HOME}/shorebird")
        echo "path=$install_path" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Determine Install Path (Windows)
      if: ${{ runner.os == 'Windows' }}
      id: install-path-windows
      run: |
        $install_path = [IO.Path]::Combine($home, ".shorebird")
        Write-Output "path=$install_path" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: "\U0001F4BE Configure Shorebird Cache"
      if: ${{ inputs.cache == 'true' }}
      id: cache-shorebird
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.install-path.outputs.path || steps.install-path-windows.outputs.path }}
        key: shorebird-cache-key-${{ runner.os }}-${{ runner.arch }}${{ inputs.shorebird-version && format('-{0}', inputs.shorebird-version) || '' }}
    - name: "\U0001F426 Install Shorebird (MacOS / Linux)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version == '' && runner.os != 'Windows' }}
      run: |
        INSTALL_SCRIPT="$(mktemp)"
        curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf -o "$INSTALL_SCRIPT"
        bash "$INSTALL_SCRIPT" --force
        rm -f "$INSTALL_SCRIPT"
      shell: bash
    - name: "\U0001F426 Install Shorebird (Windows)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version == '' && runner.os == 'Windows' }}
      run: |
        Set-ExecutionPolicy RemoteSigned -scope CurrentUser # Needed to execute remote scripts
        $install_script = [IO.Path]::Combine([IO.Path]::GetTempPath(), [IO.Path]::GetRandomFileName() + ".ps1")
        Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/shorebirdtech/install/main/install.ps1' -OutFile $install_script
        & $install_script
        Remove-Item $install_script -ErrorAction SilentlyContinue
      shell: pwsh
    # A pinned version skips the installer, which would first download the
    # latest CLI and its Flutter. Clone the CLI at the release tag instead,
    # as the installer does for the stable branch.
    - name: "\U0001F4CC Install Pinned Shorebird (MacOS / Linux)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version != '' && runner.os != 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path.outputs.path }}
        VERSION: ${{ inputs.shorebird-version }}
      run: |
        rm -rf "$INSTALL_PATH"
        git clone --quiet -c advice.detachedHead=false --branch "v${VERSION#v}" https://github.com/shorebirdtech/shorebird.git "$INSTALL_PATH"
        "$INSTALL_PATH/bin/shorebird" --version
      shell: bash
    - name: "\U0001F4CC Install Pinned Shorebird (Windows)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit != 'true' && inputs.shorebird-version != '' && runner.os == 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path-windows.outputs.path }}
        VERSION: ${{ inputs.shorebird-version }}
      run: |
        if (Test-Path $env:INSTALL_PATH) { Remove-Item -Recurse -Force $env:INSTALL_PATH }
        $tag = "v" + $env:VERSION.TrimStart("v")
        git clone --quiet -c advice.detachedHead=false --branch $tag https://github.com/shorebirdtech/shorebird.git $env:INSTALL_PATH
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & (Join-Path $env:INSTALL_PATH "bin\shorebird.ps1") --version
      shell: pwsh
    # Adding the CLI to PATH is this action's job, so the GITHUB_PATH writes
    # below are intentional.
    - name: ➕ Add Shorebird to Path (MacOS / Linux)
      if: ${{ runner.os != 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path.outputs.path }}
      run: |
        safe=$(printf '%s' "$INSTALL_PATH" | tr -d '\n\r')
        echo "${safe}/bin" >> "$GITHUB_PATH"
        echo "added ${safe}/bin to GITHUB_PATH"
      shell: bash
    - name: ➕ Add Shorebird to Path (Windows)
      if: ${{ runner.os == 'Windows' }}
      env:
        INSTALL_PATH: ${{ steps.install-path-windows.outputs.path }}
      run: |
        $safe = $env:INSTALL_PATH -replace '[\r\n]', ''
        Add-Content $env:GITHUB_PATH "$safe\bin"
        Write-Output "added $safe\bin to GITHUB_PATH"
      shell: pwsh
    - name: "\U0001F344 Ensure Shorebird is Up-to-Date (MacOS / Linux)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit == 'true' && inputs.shorebird-version == '' && runner.os != 'Windows' }}
      run: shorebird upgrade
      shell: bash
    - name: "\U0001F344 Ensure Shorebird is Up-to-Date (Windows)"
      if: ${{ steps.cache-shorebird.outputs.cache-hit == 'true' && inputs.shorebird-version == '' && runner.os == 'Windows' }}
      run: shorebird upgrade
      shell: pwsh
